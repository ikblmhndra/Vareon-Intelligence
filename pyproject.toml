[project]
name = "cti-platform"
version = "0.7.0"
description = "CTI platform monorepo — scrapers, enrichment, API and web"
requires-python = ">=3.12"
dependencies = [
    "cti-core",
    "cti-scraper",
    "cti-enrich",
    "cti-alerts",
    "cti-scrapers",
    "cti-worker",
    "cti-api",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "respx>=0.21",
    "testcontainers[postgres]>=4.5",
    "syrupy>=4.7",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "scrapers", "apps/worker", "apps/api"]

[tool.uv.sources]
cti-core = { workspace = true }
cti-scraper = { workspace = true }
cti-enrich = { workspace = true }
cti-alerts = { workspace = true }
cti-scrapers = { workspace = true }
cti-worker = { workspace = true }
cti-api = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
# Root repo di sys.path -- test yang ngeimpor `tools.*` (mis. tools/llm/probe_json.py).
pythonpath = ["."]
asyncio_mode = "auto"
# "session" (bukan default "function") -- `cti_core.db.engine.get_async_engine()`
# di-@lru_cache SEKALI per proses (Fase 2, disengaja: satu pool koneksi,
# bukan bikin ulang tiap panggilan). Event loop asyncio default
# pytest-asyncio scope-nya "function" (loop BARU tiap test) -- engine yang
# dicache lintas-loop bikin `RuntimeError: Event loop is closed` pas
# teardown connection dari test KEDUA dan seterusnya (asyncpg connection
# bawa referensi ke loop tempat dia dibikin). Ketauan Fase 7 (7.1/7.2)
# waktu test integrasi auth pertama kali punya LEBIH DARI SATU test
# async dalam satu run -- sebelumnya cuma ada 1 test async di seluruh
# suite (`test_async_article_repo_upsert_works`), jadi gak pernah kebuka.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = ["error::DeprecationWarning:cti_.*"]
markers = ["playwright: butuh Chromium ke-install (uv sync --extra browser di cti-scraper)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# typer.Option()/typer.Argument() di default parameter itu idiom RESMI
# typer (dibaca introspeksi lewat Depends-style), bukan bug B008 biasa.
"**/cli/*.py" = ["B008"]
# Scraper hasil migrasi (Fase 4): XPath literal DOM asli kadang panjang --
# maksa wrap di tengah string XPath cuma bikin susah dibaca, gak ada
# manfaat. Ini file GENERATED, bukan ditulis tangan.
"scrapers/src/cti_scrapers/feeds/*.py" = ["E501"]
"scrapers/src/cti_scrapers/collectors/*.py" = ["E501"]
# Prompt LLM disalin verbatim dari articleValidator.py/cveValidator.py
# (Fase 5) -- maksa wrap di tengah kalimat instruksi cuma bikin diff-nya
# sama source asli makin susah dicek, gak ada manfaat.
"packages/cti-enrich/src/cti_enrich/stages/classify.py" = ["E501"]
"packages/cti-enrich/src/cti_enrich/stages/extract_ttps.py" = ["E501"]
# Sama alasan -- prompt LLM disalin verbatim dari `ta_profile_service.py`
# lama (Fase 7.3, router `ta_groups`).
"apps/api/src/cti_api/services/ta_profile.py" = ["E501"]
# Sama alasan -- prompt LLM disalin verbatim dari `newsletter_service.py`
# lama (Fase 7.3, router `newsletter`, Bagian 4).
"apps/api/src/cti_api/services/newsletter.py" = ["E501"]
# Sama alasan -- prompt LLM disalin verbatim dari `recap_service.py` lama
# (Fase 7.3, router `recap`, Bagian 5).
"apps/api/src/cti_api/services/recap.py" = ["E501"]
# Sama alasan -- prompt LLM disalin verbatim dari `exec_brief_service.py`
# lama (Fase 7.3, router `exec_dashboard`, Bagian 5).
"apps/api/src/cti_api/services/exec_brief.py" = ["E501"]
# Sama alasan -- 3 prompt LLM disalin verbatim dari `cve_email_service.py`
# lama (Fase 7.4 Grup C, router `cve`).
"apps/api/src/cti_api/services/cve_email.py" = ["E501"]
# `Depends(...)` di default parameter itu idiom RESMI FastAPI (dependency
# injection dibaca lewat introspeksi signature) -- sama alasan kayak
# ignore `typer.Option()` di atas, bukan bug B008 biasa.
"apps/api/src/cti_api/deps.py" = ["B008"]
"apps/api/src/cti_api/routers/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
# `@app.task(...)` (Celery) gak preserve signature fungsi yang di-decorate
# di stub resminya -- "untyped-decorator" bakal muncul di SETIAP task,
# bukan sesuatu yang bisa dibenerin per-file pakai inline `# type: ignore`
# (posisi baris-nya gak stabil buat decorator multi-baris). Cuma 2 modul
# task (`tasks/scrape.py`, `tasks/enrich.py`) yang kena -- bukan disable
# strict buat seluruh `apps/worker`.
module = ["cti_worker.tasks.scrape", "cti_worker.tasks.enrich", "cti_worker.tasks.periodic"]
disable_error_code = ["untyped-decorator"]
