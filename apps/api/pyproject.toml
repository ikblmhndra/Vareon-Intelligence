[project]
name = "cti-api"
version = "0.7.2"
description = "FastAPI -- REST API (auth, artikel, CVE, IOC, dst), port dari ScraperNewsWeb"
requires-python = ">=3.12"
dependencies = [
    "cti-core",
    "cti-alerts",
    "cti-scraper",
    # Control plane (`routers/scraper.py`: list/detail/trigger/dry-run/health)
    # nge-`discover()` registry -- tanpa paket 84 plugin ini registry KOSONG
    # (`discover()` diam-diam balik `{}` kalau `cti_scrapers` gak ke-import),
    # dan halaman /scrapers di produksi cuma nampilin nol scraper. Ketauan pas
    # smoke test image Fase 10.B; di dev gak kelihatan karena semua ter-install.
    "cti-scrapers",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.1",
    "python-docx>=1.1",
    "openai>=1.30",
    "httpx>=0.27",
    "jinja2>=3.1",
    "trafilatura>=1.9",
    "playwright>=1.44",
    "python-multipart>=0.0.9",
    "scikit-learn>=1.5",
    "openpyxl>=3.1",
    # openpyxl cuma baca/tulis gambar kalau Pillow ke-import; tanpa ini logo di
    # template CVE tracker (`xl/media/image1.png`) hilang diam-diam di hasil export.
    "pillow>=10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cti_api"]
