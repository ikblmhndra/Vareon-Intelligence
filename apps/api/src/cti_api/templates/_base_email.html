<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>{% block title %}{{ platform_name }}{% endblock %}</title>
<style>
  /* Dasar brand (Vareon Intelligence). Klien email: CSS inline/hex saja, tanpa
     oklch/var()/animasi; web font tidak dijamin (Outlook desktop) jadi ada stack cadangan. */
  body { font-family: 'Google Sans Flex', 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif; line-height: 1.6; color: #430a23; background: #f2e8dd; margin: 0; padding: 20px; }
</style>
<style>
{% block styles %}{% endblock %}
</style>
{% block head_extra %}{% endblock %}
</head>
<body>
{% block content %}{% endblock %}
</body>
</html>
