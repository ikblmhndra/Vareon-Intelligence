[project]
name = "cti-worker"
version = "0.7.2"
description = "Celery worker -- eksekusi scraper terjadwal + enrichment artikel"
requires-python = ">=3.12"
dependencies = [
    "cti-core",
    "cti-scraper",
    "cti-scrapers",
    "cti-enrich",
    "cti-alerts",
    # 5 loop beat (Fase 7.8, tasks/periodic.py) reuse LANGSUNG fungsi
    # async "session-first" yang udah ada di cti_api.services (cve_lookup,
    # recap, dst) lewat asyncio.run() -- daripada nulis ulang jadi versi
    # sync, dedup logic bisnis (satu sumber, dipakai API DAN worker).
    # Belum ada image Docker terpisah worker/api (plan §10, belum
    # dikerjain) -- kalau nanti dipisah dan berat cti-api (fastapi/
    # playwright/sklearn) jadi masalah nyata, revisit di situ.
    "cti-api",
    "celery[redis]>=5.4",
]

# worker-nlp (Docker image, Fase 9/10) yang install extra ini -- worker
# scrape biasa gak butuh torch/spacy sama sekali. Sama pola persis
# cti-enrich's nlp extra (lihat pyproject.toml situ).
[project.optional-dependencies]
nlp = ["cti-enrich[nlp]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cti_worker"]
