[project]
name = "cti-scrapers"
version = "0.8.3"
description = "Scraper konkret -- satu file per scraper. Lihat docs/ADDING_A_SCRAPER.md."
requires-python = ">=3.12"
dependencies = [
    "cti-scraper",
    "cti-enrich",
    "cti-alerts",
    "pycountry>=23.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cti_scrapers"]
