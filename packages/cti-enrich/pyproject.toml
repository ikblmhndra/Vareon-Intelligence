[project]
name = "cti-enrich"
version = "0.2.0"
description = "Article enrichment pipeline — the decomposition of the legacy nlp_scan()"
requires-python = ">=3.12"
dependencies = [
    "cti-core",
    "httpx>=0.27",
    "openai>=1.30",
    "trafilatura>=1.9",
    "playwright>=1.44",
    "pycountry>=24.6",
]

# Heavy models live behind an extra so the API image never pulls spacy/sumy.
# Only the worker-nlp image installs cti-enrich[nlp].
#
# `torch` SENGAJA GAK ada di sini (dibuang Fase 10, sebelumnya `torch>=2.3`):
# Fase 0.9 udah ngonfirmasi nol importer (yang kepake cuma `sumy.LsaSummarizer`,
# bukan bert-extractive-summarizer), `git grep` juga kosong, dan gak ada paket
# lain yang require dia. Di image Linux dia narik ~2-3GB (wheel CUDA) buat
# nol manfaat.
[project.optional-dependencies]
nlp = [
    "spacy>=3.7",
    "sumy>=0.11",
    "nltk>=3.9",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cti_enrich"]

[tool.hatch.metadata]
allow-direct-references = true
