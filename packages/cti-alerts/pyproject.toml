[project]
name = "cti-alerts"
version = "0.8.9"
description = "Outbound alerting — one Telegram sender, one Graph/SMTP mailer"
requires-python = ">=3.12"
dependencies = [
    "cti-core",
    "httpx>=0.27",
    "msal>=1.28",
    "jinja2>=3.1",
    "python-telegram-bot>=21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cti_alerts"]
