[project]
name = "cti-scraper"
version = "0.7.3"
description = "Scraper plugin framework — BaseScraper, registry, dedup, run heartbeats"
requires-python = ">=3.12"
dependencies = [
    "cti-core",
    "cti-alerts",
    "pydantic>=2.7",
    "httpx>=0.27",
    "defusedxml>=0.7",
    "lxml>=5.2",
    "croniter>=2.0",
    "tenacity>=8.3",
    "redis>=5.0",
    "typer>=0.12",
]

[project.optional-dependencies]
browser = ["playwright>=1.44"]

[project.scripts]
cti-scraper = "cti_scraper.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cti_scraper"]
