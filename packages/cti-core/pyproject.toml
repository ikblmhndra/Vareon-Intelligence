[project]
name = "cti-core"
version = "0.8.12"
description = "Shared config, database models and logging for the CTI platform"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.1",
    "structlog>=24.1",
    "celery[redis]>=5.4",
    "openai>=1.30",
    # Fernet buat secret yang dikelola lewat UI admin (ROADMAP #23). Sebelumnya cuma ikut transitif
    # lewat python-jose di apps/api; cti-core sekarang memakainya langsung, jadi dideklarasikan sendiri.
    "cryptography>=42",
    # Parser aturan Sigma (P7e); sebelumnya hanya transitif, versi terkunci tidak berubah.
    "pyyaml>=6.0",
]

[project.scripts]
cti-entity = "cti_core.entity.cli:main"
cti-sigma = "cti_core.hunt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cti_core"]
